$def with(contacto)

<form name="contacto" method="get">
    <label for="nombre">Nombre</label>
    <input type="text" name="nombre" id="nombre" value="$contacto[0]['nombre']"><br>

    <label for="email">Email</label>
    <input type="text" name="email" id="email" value="$contacto[0]['email']"><br>

    <label for="telefono">Telefono</label>
    <input type="text" name="telefono" id="telefono" value="$contacto[0]['telefono']"><br>

    <input type="button" onclick="window.location.href='/contactos';" value="Regresar">

</form>
